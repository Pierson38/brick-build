name: Bug
description: Something does not work as expected.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a problem!
        **Never attach** a LEGO instruction booklet, a third-party set file (`.mpd`, `.ldr`, including from the OMR) or a parts library: give the set number and the link to its page instead.
        A security vulnerability must be reported privately: see [SECURITY.md](https://github.com/Pierson38/brick-build/blob/main/SECURITY.md).
  - type: textarea
    id: description
    attributes:
      label: What is happening?
      description: Describe the problem and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open /atelier
        2. Import fixtures/mini-4-pieces.mpd
        3. …
    validations:
      required: true
  - type: input
    id: set
    attributes:
      label: Set or file concerned
      description: Set number and file source (link to the OMR page, repository fixture, file written by you…).
      placeholder: 31040-1, https://library.ldraw.org/omr/sets/…
  - type: dropdown
    id: os
    attributes:
      label: System
      options:
        - macOS
        - Windows (preview)
        - Other (not supported)
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and version
      placeholder: Chrome 142, Safari 26…
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Node.js version and commit
      description: Results of `node --version` and `git rev-parse --short HEAD`.
      placeholder: v24.5.0, 31fe635
    validations:
      required: true
  - type: textarea
    id: check-ldraw
    attributes:
      label: Output of `npm run check:ldraw`
      render: text
  - type: textarea
    id: extra
    attributes:
      label: Screenshots, error messages, browser console
      description: A screenshot of the application is helpful; make sure no instruction booklet page is visible in it.
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched the existing issues.
          required: true
        - label: I did not attach any instruction booklet, third-party set file, parts library or API key.
          required: true
