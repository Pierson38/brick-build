name: Question
description: A question about installation, usage or the code.
labels: [question]
body:
  - type: markdown
    attributes:
      value: |
        Have you read through the [README](https://github.com/Pierson38/brick-build/blob/main/README.md) (installation, known limitations)?
        Do not attach any instruction booklet, third-party set file or API key.
  - type: textarea
    id: question
    attributes:
      label: Your question
    validations:
      required: true
  - type: textarea
    id: contexte
    attributes:
      label: Context
      description: System, browser, Node.js version, what you have already tried.
