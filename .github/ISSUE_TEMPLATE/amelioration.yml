name: Improvement
description: Suggest a feature or an enhancement.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Before suggesting, take a look at the [product scope](https://github.com/Pierson38/brick-build/blob/main/docs/01_PRODUIT_ET_PERIMETRE.md) and the [project principles](https://github.com/Pierson38/brick-build/blob/main/CONTRIBUTING.md#suggesting-an-improvement).
  - type: textarea
    id: probleme
    attributes:
      label: What need or problem?
      description: What you are trying to do and what is stopping you today.
    validations:
      required: true
  - type: textarea
    id: proposition
    attributes:
      label: Proposal
      description: What you have in mind (user flow, mockup, expected behavior).
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: principes
    attributes:
      label: Project principles
      options:
        - label: The proposal works locally, with no account, no telemetry and no cloud storage.
          required: true
        - label: It involves neither automatic downloading of instruction booklets nor scraping of third-party sites.
          required: true
        - label: I am ready to submit a PR.
